name: BondScanner
options:
  bundleIdPrefix: local.bondscanner
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SWIFT_VERSION: "5.0"
    COMBINE_HIDPI_IMAGES: YES
  configs:
    Debug:
      ENABLE_TESTABILITY: YES

targets:
  BondScanner:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: BondScanner
        PRODUCT_BUNDLE_IDENTIFIER: local.bondscanner.NativeApp
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Sources/ExceptionCatcher.h
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: NO
        # A hosted XCTest bundle links the app module via TEST_HOST. Xcode 27's
        # debug-dylib executor leaves the bundle without a resolvable app dylib.
        ENABLE_DEBUG_DYLIB: NO
    dependencies:
      - sdk: AppKit.framework
      - sdk: AVFoundation.framework
      - sdk: Vision.framework
      - sdk: CoreImage.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: QuartzCore.framework
      - sdk: ImageIO.framework
      - sdk: AudioToolbox.framework
      - sdk: UniformTypeIdentifiers.framework

  BondScannerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Tests
    dependencies:
      - target: BondScanner
    settings:
      base:
        PRODUCT_NAME: BondScannerTests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Camera tests"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
        # Hosted macOS XCTest must load the built application, not XcodeGen's
        # legacy build/Debug path. Disable debug dylib indirection so the test
        # bundle has one stable host executable/rpath in CLI and Xcode launches.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BondScanner.app/Contents/MacOS/BondScanner"
        BUNDLE_LOADER: "$(TEST_HOST)"
        ENABLE_DEBUG_DYLIB: NO

schemes:
  BondScanner:
    build:
      targets:
        BondScanner: all
        BondScannerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      environmentVariables:
        BONDSCANNER_TEST_MODE: "1"
      targets:
        - BondScannerTests

  BondScannerHardwareEvaluation:
    build:
      targets:
        BondScanner: all
        BondScannerTests: [test]
    test:
      config: Debug
      # This is deliberately a separate, explicit scheme. It is the only
      # generated configuration that can invoke private local-model inference.
      environmentVariables:
        BONDSCANNER_TEST_MODE: "1"
        BONDSCANNER_RUN_LOCAL_AI_EVAL: "1"
        BONDSCANNER_AI_EVAL_LIMIT: "5"
        BONDSCANNER_AI_EVAL_MODE: "review"
      targets:
        - BondScannerTests

  BondScannerManifestDraft:
    build:
      targets:
        BondScanner: all
        BondScannerTests: [test]
    test:
      config: Debug
      # Creates an ignored, explicitly unverified draft only. It never changes
      # manifest.json, which remains reserved for human-verified ground truth.
      environmentVariables:
        BONDSCANNER_TEST_MODE: "1"
        BONDSCANNER_GENERATE_AI_DRAFT: "1"
      targets:
        - BondScannerTests
